lang en_US.UTF-8
keyboard us
timezone UTC --utc

zerombr
clearpart --all --initlabel --disklabel=gpt
autopart --noswap

network --bootproto=dhcp --device=link --activate

bootc --source-imgref=registry:ghcr.io/burmistery/fedorium:latest --target-imgref=ghcr.io/burmistery/fedorium:latest

%post --erroronfail --nochroot
set -xeuo pipefail

echo 'Copying home files to subvol=home'
device=$(awk '$2 == "/mnt/sysroot" {print $1}' /proc/mounts)
mount -t btrfs -o subvol=root,X-mount.mkdir "${device}" /mnt/root_subvol
mount -t btrfs -o subvol=home "${device}" /mnt/sysroot/home
cp -ra /mnt/root_subvol/ostree/deploy/default/var/home/. /mnt/sysroot/home

cp --remove-destination /etc/resolv.conf /mnt/sysroot/etc
%end

%post --erroronfail
set -xeuo pipefail

echo 'Fix fstab'
sed -i '\|^[^#].*[[:space:]]/[[:space:]]|d' /etc/fstab

mount -t devtmpfs devtmpfs /dev
mount -t devpts devpts /dev/pts

f_init_chezmoi() {
    user="$1"
    url="$2"

    sudo -u "${user}" GIT_TERMINAL_PROMPT=0 chezmoi init --apply "${url}"
}

# user config
while IFS= read -r user; do
    [ -n "${user}" ] || continue

    usermod -aG greeter "${user}"

    f_init_chezmoi "${user}" "https://github.com/${user}/dotfiles.git" \
        || f_init_chezmoi "${user}" "https://github.com/${user}/chezmoi.git" \
        || echo "No chezmoi repo found for ${user}, skipping"
done < <(awk -F':' '$6 ~ "^/home" {print $1}' "/etc/passwd")
%end
