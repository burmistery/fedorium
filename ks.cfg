lang en_US.UTF-8
keyboard us
timezone UTC --utc

zerombr
clearpart --all --initlabel --disklabel=gpt
autopart --noswap

network --bootproto=dhcp --device=link --activate

bootc --source-imgref=registry:ghcr.io/burmistery/fedorium:latest --target-imgref=ghcr.io/burmistery/fedorium:latest

%post --erroronfail
set -eux

mkdir -p /mnt/home
mount -t btrfs -o subvol=home LABEL=fedora_fedora /mnt/home

mv /var/home/. /mnt/home

umount /mnt/home
rm -rf /mnt/home
%end
