---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fedorium
description: This is my personal OS image.

base-image: quay.io/fedora/fedora-bootc
image-version: 44

modules:
  - type: script
    snippets:
      - echo 'tsflags=nodocs' >> /etc/dnf/dnf.conf

  - from-file: desktop.yml
  - from-file: games.yml
  - from-file: work.yml

  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - zsh
        - fzf
        - bat
        - zoxide
        - glibc-all-langpacks

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - io.neovim.nvim

  - type: signing
